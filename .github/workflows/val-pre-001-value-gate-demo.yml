name: "VAL-PRE-001: CI check + CD deployment gate demo"

# Temporary standalone companion for doruit/forged-with-foundry's VAL-PRE-001 control.
# The CI check validates the exact agent.yaml state whose outputs are consumed by the
# deployment job. Azure Policy remains presence-only platform enforcement: it never
# reads agent.yaml and cannot distinguish genuine tags from forged metadata.

"on":
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ci-check:
    name: "CI check (Gate 1): agent.yaml must be structurally complete"
    runs-on: ubuntu-latest
    outputs:
      value_hypothesis_status: ${{ steps.assess.outputs.value_hypothesis_status }}
      business_case_id: ${{ steps.assess.outputs.business_case_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Validate the deployment input and expose trusted outputs
        id: assess
        run: |
          python scripts/validate_value_hypothesis.py fixtures/agent.yaml --enforce
          result="$(python scripts/validate_value_hypothesis.py fixtures/agent.yaml)"
          echo "${result}"
          status="$(echo "${result}" | python -c 'import json, sys; print(json.load(sys.stdin)["valueHypothesisStatus"])')"
          business_case_id="$(echo "${result}" | python -c 'import json, sys; print(json.load(sys.stdin)["businessCaseId"])')"
          echo "value_hypothesis_status=${status}" >> "${GITHUB_OUTPUT}"
          echo "business_case_id=${business_case_id}" >> "${GITHUB_OUTPUT}"

      - name: Prove an incomplete hypothesis is blocked before Azure
        run: |
          set +e
          python scripts/validate_value_hypothesis.py fixtures/agent.incomplete.yaml --enforce
          exit_code=$?
          set -e
          echo "Validator exit code: ${exit_code}"
          if [ "${exit_code}" -eq 0 ]; then
            echo "::error::Expected --enforce to fail on an incomplete hypothesis, but it passed."
            exit 1
          fi
          echo "BLOCKED as expected. No Azure credentials were used and no Azure call was made."

  cd-deploy-gate-2-allowed:
    name: "CD deployment: validated CI outputs + Azure Policy"
    needs: ci-check
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy using the exact outputs produced by Gate 1
        run: |
          az deployment group create \
            --name "val-pre-001-gha-complete-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/demo-target.bicep \
            --parameters demoResourceName=valpre001-gha-demo \
                         valueHypothesisStatus="${{ needs.ci-check.outputs.value_hypothesis_status }}" \
                         businessCaseId="${{ needs.ci-check.outputs.business_case_id }}"
          echo "VALIDATED and deployed as expected by Azure Policy."
      - name: Clean up the demo resource this run created
        if: always()
        run: |
          az resource delete \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name valpre001-gha-demo \
            --resource-type Microsoft.Insights/actionGroups 2>/dev/null || true

  cd-deploy-gate-2-backstop:
    name: "CD deployment backstop: Azure Policy blocks invalid metadata"
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Attempt a deployment that skipped Gate 1 and sends invalid metadata
        run: |
          set +e
          az deployment group create \
            --name "val-pre-001-gha-bypass-${{ github.run_id }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/demo-target.bicep \
            --parameters demoResourceName=valpre001-gha-bypass-demo \
                         valueHypothesisStatus=incomplete \
                         businessCaseId="" \
            --output none 2> az-error.log
          exit_code=$?
          set -e
          if [ "${exit_code}" -eq 0 ]; then
            echo "::error::Azure allowed invalid deployment metadata. Azure Policy should have denied it."
            exit 1
          fi
          if ! grep -q "RequestDisallowedByPolicy" az-error.log; then
            cat az-error.log
            echo "::error::The deployment failed, but not because Azure Policy denied it."
            exit 1
          fi
          echo "BLOCKED by Azure Policy as expected. This proves metadata enforcement only;"
          echo "it does NOT prove the CI check ran and cannot distinguish forged valid-looking tags."
